[package]
name = "cache-out"
version = "0.1.0"
edition = "2021"

[lib]
name = "cache_out_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
psl = "2"
url = "2"
